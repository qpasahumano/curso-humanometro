                    
<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes"
    >

    <meta
        name="theme-color"
        content="#4a2918"
    >

    <title>Curso Humanómetro · Guía de Trinchera</title>

    <link
        rel="stylesheet"
        href="style.css?v=14"
    >

</head>


<body>


<main>

    <section class="escena-pupitre">


        <!-- ==================================================
             PIZARRÓN
             ================================================== -->

        <div class="zona-pizarron">

            <img
                src="wide_horizontal_png_style_illustration_on_a_transp.png"
                class="pizarron"
                alt="Pizarrón del Curso Humanómetro"
                draggable="false"
            >

        </div>



        <!-- ==================================================
             HOJAS DEL CURSO
             ================================================== -->

        <div class="zona-hojas">


            <div
                class="hojas-carrusel"
                id="carruselHojas"
                role="region"
                aria-label="Páginas del curso Humanómetro"
            >


            <article
                class="hoja-papel hoja-1"
                onclick="abrirPagina(1)"
            >
                <img
                    src="pagina_1.png"
                    class="miniatura"
                    alt="Página 1"
                    draggable="false"
                >
            </article>


            <article
                class="hoja-papel hoja-2"
                onclick="abrirPagina(2)"
            >
                <img
                    src="pagina_2.png"
                    class="miniatura"
                    alt="Página 2"
                    draggable="false"
                >
            </article>


            <article
                class="hoja-papel hoja-3"
                onclick="abrirPagina(3)"
            >
                <img
                    src="pagina_3.png"
                    class="miniatura"
                    alt="Página 3"
                    draggable="false"
                >
            </article>


            <article
                class="hoja-papel hoja-4"
                onclick="abrirPagina(4)"
            >
                <img
                    src="pagina_4.png"
                    class="miniatura"
                    alt="Página 4"
                    draggable="false"
                >
            </article>


            <article
                class="hoja-papel hoja-5"
                onclick="abrirPagina(5)"
            >
                <img
                    src="pagina_5.png"
                    class="miniatura"
                    alt="Página 5"
                    draggable="false"
                >
            </article>


            <article
                class="hoja-papel hoja-6"
                onclick="abrirPagina(6)"
            >
                <img
                    src="pagina_6.png"
                    class="miniatura"
                    alt="Página 6"
                    draggable="false"
                >
            </article>


            <article
                class="hoja-papel hoja-7"
                onclick="abrirPagina(7)"
            >
                <img
                    src="pagina_7.png"
                    class="miniatura"
                    alt="Página 7"
                    draggable="false"
                >
            </article>


            <article
                class="hoja-papel hoja-8"
                onclick="abrirPagina(8)"
            >
                <img
                    src="pagina_8.png"
                    class="miniatura"
                    alt="Página 8"
                    draggable="false"
                >
            </article>


            <article
                class="hoja-papel hoja-9"
                onclick="abrirPagina(9)"
            >
                <img
                    src="pagina_9.png"
                    class="miniatura"
                    alt="Página 9"
                    draggable="false"
                >
            </article>


            <article
                class="hoja-papel hoja-10"
                onclick="abrirPagina(10)"
            >
                <img
                    src="pagina_10.png"
                    class="miniatura"
                    alt="Página 10"
                    draggable="false"
                >
            </article>


            </div>


            <div class="indicador-scroll">
                DESLIZÁ ← →
            </div>


            <div class="anotacion-hojas">
                LEE LAS HOJAS
            </div>


        </div>



        <!-- ==================================================
             COMPUTADORA
             ================================================== -->

        <section class="zona-computadora">


            <div class="computadora-real">


                <img
                    src="computadora_retro_80_90.png"
                    class="computadora-imagen"
                    alt="Computadora retro"
                    draggable="false"
                >


                <div class="pantalla-youtube">

                    <iframe
                        src="https://www.youtube.com/embed/videoseries?list=PLgMXXa_ibKppXXotFeUcuNdBL-Zm5GKxA"
                        title="Curso Humanómetro"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                        allowfullscreen>
                    </iframe>

                </div>


            </div>


        </section>



        <!-- ==================================================
             RESPALDO DE SILLA / ACCESO
             ================================================== -->

        <section class="zona-silla">


            <div class="silla-real">


                <img
                    src="respaldo_silla_humanometro.png"
                    class="respaldo-silla"
                    alt="Respaldo de silla con acceso al curso"
                    draggable="false"
                >


                <a
                    href="https://mpago.la/2392HZX"
                    class="boton-silla"
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label="Desbloquear conocimientos"
                ></a>


            </div>


        </section>


        <!-- ==================================================
             CRÉDITOS
             ================================================== -->

        <footer class="creditos">

            Diseño de página · Diseño de sitio · Carlos Amado Selim

        </footer>


    </section>


</main>



<!-- ==================================================
     VISOR DE PÁGINAS
     ================================================== -->

<div
    id="modalPdf"
    class="modal"
    aria-hidden="true"
>


    <div class="modal-contenido">


        <button
            class="cerrar-modal"
            type="button"
            onclick="cerrarModal()"
            aria-label="Cerrar"
        >
            ×
        </button>


        <div class="carpeta-visor">


            <div class="hoja-lectura">

                <img
                    id="paginaVisor"
                    src=""
                    alt="Página del curso"
                    draggable="false"
                >

            </div>


            <section
                class="zona-complementaria"
                aria-label="Contenido complementario de la página"
            >

                <div class="fila-acciones">


                    <button
                        id="botonVideoComplementario"
                        class="boton-video-complementario"
                        type="button"
                        onclick="alternarVideoComplementario()"
                    >
                        ▶ VER VIDEO
                    </button>


                    <button
                        id="accionPagina"
                        class="accion-pagina"
                        type="button"
                        onclick="avanzarPagina()"
                    >
                        SIGUIENTE PÁGINA
                    </button>


                </div>


                <div
                    id="subtituloVideo"
                    class="subtitulo-video"
                    aria-live="polite"
                ></div>


                <div
                    id="contenedorVideoComplementario"
                    class="contenedor-video-complementario"
                    aria-hidden="true"
                >

                    <div class="video-responsive">

                        <iframe
                            id="videoComplementario"
                            title="Video complementario del curso Humanómetro"
                            src=""
                            allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                            allowfullscreen>
                        </iframe>

                    </div>

                </div>


            </section>


        </div>


    </div>


</div>



<script src="script.js?v=14"></script>


</body>

</html>
